---
- name: Banners Management
  ansible.builtin.include_tasks:
    file: banners.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"

- name: Configure Firewall (First to avoid lockout)
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_firewall_enable | bool

- name: PAM and Password Policy
  ansible.builtin.include_tasks:
    file: pam.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"

- name: Cron Hardening
  ansible.builtin.include_tasks:
    file: cron.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_cron_enable | bool

- name: Kernel Module Hardening
  ansible.builtin.include_tasks:
    file: modules.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_modules_enable | bool

- name: FSTAB Hardening
  ansible.builtin.include_tasks:
    file: fstab.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"

- name: User Management
  ansible.builtin.include_tasks:
    file: users.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_users_enable | bool

- name: System Updates
  ansible.builtin.include_tasks:
    file: updates.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_updates_enable | bool

- name: Configure SSH Hardening
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_ssh_enable | bool

- name: Configure Unattended Upgrades
  ansible.builtin.include_tasks:
    file: unattended_upgrades.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_unattended_upgrades_enable | bool

- name: Configure Fail2Ban
  ansible.builtin.include_tasks:
    file: fail2ban.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_fail2ban_enable | bool

- name: Configure Postfix MTA
  ansible.builtin.include_tasks:
    file: postfix.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_postfix_enable | bool

- name: Configure Sysctl Hardening
  ansible.builtin.include_tasks:
    file: sysctl.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_sysctl_enable | bool

- name: Configure File Permissions
  ansible.builtin.include_tasks:
    file: permissions.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_permissions_enable | bool

- name: Configure Auditd
  ansible.builtin.include_tasks:
    file: auditd.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_auditd_enable | bool

- name: Configure Fluent Bit
  ansible.builtin.include_tasks:
    file: fluentbit.yml
    apply:
      check_mode: "{{ hardening_mode == 'audit' }}"
  when: hardening_fluentbit_enable | bool

- name: Final SSH Connection Check
  ansible.builtin.wait_for:
    port: "{{ hardening_ssh_port }}"
    host: "{{ ansible_host | default(inventory_hostname) }}"
    search_regex: OpenSSH
    timeout: 10
  delegate_to: localhost
  become: false
  when: 
    - hardening_ssh_enable | bool
    - hardening_mode != 'audit'
